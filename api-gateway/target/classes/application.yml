server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://127.0.0.1:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/users/**

        - id: crop-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/crops/**

        - id: rental-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/rentals/**

        - id: weather-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/weather/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
